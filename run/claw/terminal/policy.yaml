version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /opt]
  read_write: [/home/sandbox, /tmp, /dev]
landlock:
  # Installed OpenShell 0.0.85 requires this compatibility mode; test denials.
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  controller:
    endpoints:
      - host: host.openshell.internal
        port: 30081
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /v1/models}
          - allow: {method: POST, path: /v1/chat/completions}
    binaries:
      - path: /usr/local/bin/node
  specialist:
    endpoints:
      - host: host.openshell.internal
        port: 8002
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: /v1/models}
          - allow: {method: POST, path: /v1/chat/completions}
    binaries:
      - path: /usr/local/bin/python3.12
