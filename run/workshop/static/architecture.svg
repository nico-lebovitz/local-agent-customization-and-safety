<text class="sub" x="702" y="463">Supervisor: inference endpoint</text>
<text class="sub" x="702" y="483">Provider permissions</text>
</g>
<g id="file_policy"><rect class="box trusted" x="685" y="530" width="310" height="90" rx="9"/>
<text class="title" x="702" y="558">Filesystem access</text>
<text class="sub" x="702" y="583">Read-only inputs / configuration</text>
<text class="sub" x="702" y="603">Write: outputs + temporary files</text>
</g>
<g id="tools"><rect class="box " x="1120" y="265" width="295" height="140" rx="9"/>
<text class="title" x="1137" y="293">Agent tools</text>
<text class="sub" x="1137" y="318">perceive · observation</text>
<text class="sub" x="1137" y="338">triage · specialist + validation</text>
