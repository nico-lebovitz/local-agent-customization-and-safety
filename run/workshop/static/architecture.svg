<text class="title" x="62" y="438">Gateway</text>
<text class="sub" x="62" y="463">Session + lifecycle</text>
</g>
<g id="agent"><rect class="box core" x="310" y="275" width="260" height="360" rx="9"/>
<text x="334" y="385" class="title">Agent harness</text><text x="334" y="413" class="sub">Observe → reason → act</text><text x="334" y="497" class="sub">Prompt + working state</text><text x="334" y="523" class="sub">Evidence + tool results</text><text x="547" y="328" text-anchor="end" class="port">TOOLS</text><text x="547" y="448" text-anchor="end" class="port">INFERENCE</text><text x="547" y="568" text-anchor="end" class="port">FILES</text>
</g>
<g id="tool_policy"><rect class="box trusted" x="685" y="290" width="310" height="90" rx="9"/>
<text class="title" x="702" y="318">Tool access</text>
<text class="sub" x="702" y="343">Supervisor: endpoint + process</text>
<text class="sub" x="702" y="363">Allowed API methods / paths</text>
</g>
<g id="model_policy"><rect class="box trusted" x="685" y="410" width="310" height="90" rx="9"/>
